<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Comparator</h1>
    <p class="subtitle">Compara dos respuestas HTTP (status, headers y cuerpo JSON)</p>
  </header>

  <main>
    <section class="panel">
      <h2>Request 1</h2>
      <label for="url1">URL</label>
      <input type="text" id="url1" placeholder="https://pokeapi.co/api/v2/pokemon/ditto">

      <label for="headers1">Headers (JSON)</label>
      <textarea id="headers1" rows="2" placeholder='{"Accept": "application/json"}'></textarea>

      <label for="params1">Parámetros (JSON)</label>
      <textarea id="params1" rows="2" placeholder='{"key": "value"}'></textarea>
    </section>

    <section class="panel">
      <h2>Request 2</h2>
      <label for="url2">URL</label>
      <input type="text" id="url2" placeholder="https://pokeapi.co/api/v2/pokemon/pikachu">

      <label for="headers2">Headers (JSON)</label>
      <textarea id="headers2" rows="2" placeholder='{"Accept": "application/json"}'></textarea>

      <label for="params2">Parámetros (JSON)</label>
      <textarea id="params2" rows="2" placeholder='{"key": "value"}'></textarea>
    </section>

    <div class="actions">
      <button id="compare">Comparar</button>
    </div>

    <section id="results" class="results hidden">
      <h2>Resultado</h2>
      <pre id="output"></pre>
    </section>

    <p id="error" class="error hidden"></p>
  </main>

  <footer>
    <p>Servicio: <span id="apiBase"></span></p>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
