name: Deploy frontend a GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generar config.js con la URL de la API
        run: |
          : > frontend/config.js
          printf 'const API_BASE_URL = "%s";\n' "${{ vars.API_BASE_URL }}" >> frontend/config.js

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend

      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v5
