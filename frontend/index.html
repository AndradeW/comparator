<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <h1 class="brand">Comparator</h1>
      <p class="tagline">Compara dos respuestas HTTP: status, headers y body JSON</p>
    </div>
  </header>

  <main class="page">
    <section class="request-grid" aria-label="Requests a comparar">
      <div class="request-panel" data-side="a">
        <h2 class="panel-title">Request A</h2>
        <div class="url-row">
          <label for="url1">URL</label>
          <input id="url1" class="field" type="text" placeholder="https://pokeapi.co/api/v2/pokemon/ditto" autocomplete="off" spellcheck="false">
          <label for="method1">Método</label>
          <select id="method1" class="field">
            <option value="GET" selected>GET</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
            <option value="PATCH">PATCH</option>
            <option value="DELETE">DELETE</option>
            <option value="HEAD">HEAD</option>
            <option value="OPTIONS">OPTIONS</option>
          </select>
        </div>
        <label for="headers1">Headers</label>
        <textarea id="headers1" class="field json-field" rows="3" placeholder='{"Accept": "application/json"}'></textarea>
        <label for="params1">Parámetros</label>
        <textarea id="params1" class="field json-field" rows="2" placeholder='{"key": "value"}'></textarea>
        <label for="body1">Body</label>
        <textarea id="body1" class="field" rows="2" placeholder='{"hola": "mundo"}'></textarea>
      </div>

      <div class="request-panel" data-side="b">
        <h2 class="panel-title">Request B</h2>
        <div class="url-row">
          <label for="url2">URL</label>
          <input id="url2" class="field" type="text" placeholder="https://pokeapi.co/api/v2/pokemon/pikachu" autocomplete="off" spellcheck="false">
          <label for="method2">Método</label>
          <select id="method2" class="field">
            <option value="GET" selected>GET</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
            <option value="PATCH">PATCH</option>
            <option value="DELETE">DELETE</option>
            <option value="HEAD">HEAD</option>
            <option value="OPTIONS">OPTIONS</option>
          </select>
        </div>
        <label for="headers2">Headers</label>
        <textarea id="headers2" class="field json-field" rows="3" placeholder='{"Accept": "application/json"}'></textarea>
        <label for="params2">Parámetros</label>
        <textarea id="params2" class="field json-field" rows="2" placeholder='{"key": "value"}'></textarea>
        <label for="body2">Body</label>
        <textarea id="body2" class="field" rows="2" placeholder='{"hola": "mundo"}'></textarea>
      </div>
    </section>

    <div class="action-bar">
      <label class="volatile-toggle" title="Oculta del resultado los headers que cambian en cada respuesta (Date, Age, Cf-Ray, …)">
        <input type="checkbox" id="volatile-headers" checked>
        Ocultar headers volátiles
      </label>
      <button id="compare" class="compare-btn" type="button">Comparar</button>
    </div>

    <section id="results" class="results" aria-live="polite" hidden>
      <div id="verdict" class="verdict"></div>
      <div id="ledger" class="ledger"></div>
    </section>

    <p id="error" class="error" role="alert" hidden></p>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
